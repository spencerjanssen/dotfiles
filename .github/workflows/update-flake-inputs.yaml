name: Update Flake Inputs
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update-flake-inputs:
    runs-on: ubuntu-latest
    environment: update-flake-inputs
    steps:
      - uses: cachix/install-nix-action@v31.11.3
      - name: Generate GitHub token
        uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          # update-flake-inputs needs to push changes, hence needs credentials
          persist-credentials: true
      - name: Update flake inputs
        uses: mic92/update-flake-inputs@v1.0.4
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          auto-merge: 'true'
