name: Check formatting
permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write
on:
  pull_request:
  push:
    branches:
      - main
      - flake-update
jobs:
  check_formatting:
    name: Run treefmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.3
      - run: |
          nix run .#treefmt-wrapper
      - uses: reviewdog/action-suggester@v1.27.0
        with:
          tool_name: treefmt
          level: warning
          fail_level: any
          filter_mode: nofilter
